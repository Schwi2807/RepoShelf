[package]
name = "reposhelf"
description = "RepoShelf desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "reposhelf_lib"
crate-type = ["rlib"]

[features]
default = ["ghreleases"]
# Optional GitHub release notes (FR-31, D-22). Off → `releases_fetch_github` answers `unsupported`.
ghreleases = ["rs-core/ghreleases"]
# Separate e2e build only (D-14): enables the file-clone test seam.
e2e = ["rs-core/testkit"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
rs-core = { path = "../crates/rs-core" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
trash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
git2 = { workspace = true }

[dev-dependencies]
# Command-layer tests build fixture repos with the rs-core testkit (dev-only; shipped builds never see it, D-26).
rs-core = { path = "../crates/rs-core", features = ["testkit"] }
tempfile = { workspace = true }
