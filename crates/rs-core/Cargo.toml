[package]
name = "rs-core"
description = "RepoShelf core: git read model, library, clone/fetch, DB"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
testkit = ["dep:tempfile"]
# The real HTTP transport (net.rs) and every GitHub call (notes, repo info, asset downloads). Off → `unsupported`.
ghreleases = ["dep:ureq", "dep:keyring-core", "dep:windows-native-keyring-store"]

[dependencies]
git2 = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
url = { workspace = true }
comrak = { workspace = true }
ammonia = { workspace = true }
tempfile = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
sha2 = { workspace = true }
base64 = { workspace = true }

[target.'cfg(windows)'.dependencies]
keyring-core = { workspace = true, optional = true }
windows-native-keyring-store = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# Integration tests (tests/*.rs) need the testkit fixtures; plain `cargo test -p rs-core` must run them.
rs-core = { path = ".", features = ["testkit"] }
